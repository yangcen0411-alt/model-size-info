<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型占用信息</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="tree-mode">
  <header class="header">
    <h1>模型占用信息</h1>
    <button id="refresh" class="icon-button" title="读取最新保存的文件" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-5L4 9m16 6-3 3A7 7 0 0 1 5 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <details id="more" class="more">
      <summary id="more-toggle">更多</summary>
      <div class="more-panel">
        <div class="menu-group">
          <label class="sort-option" for="tree-sort">已读取项排序<select id="tree-sort"><option value="size">大小优先</option><option value="name">名称</option><option value="model">对象编号</option></select></label>
          <button id="tree-collapse" class="menu-button">收起全部</button>
          <div class="menu-stats"><span>顶层 <b id="tree-root-count">—</b></span><span>已读取 <b id="tree-definition-count">—</b></span><span>已计算 <b id="tree-measured-count">—</b></span></div>
        </div>
        <div class="menu-group menu-info">
          <p id="note">后台分析已保存的文件。修改后保存并刷新，父级大小包含子级。</p>
          <p>1 KB = 1024 字节 · <span id="version">v1.5.0</span></p>
        </div>
      </div>
    </details>
  </header>
  <section class="model-file" aria-label="已保存模型的文件大小">
    <div class="file-content"><span id="file-name" class="file-name">正在连接…</span><span class="file-caption">已保存文件 · 后台分析</span></div>
    <div class="file-meta"><strong id="file-size">—</strong><span id="file-state">尚未保存</span></div>
  </section>
  <p id="source-note" class="source-note" hidden>模型有未保存修改，结果来自上次保存。</p>
  <main>
    <section id="tree-view" class="tree-card" aria-label="已保存模型组件树">
      <div class="tree-columns"><span>群组 / 组件</span><span title="独立保存的 SKP 文件大小，父级包含子级">文件大小</span></div>
      <div id="tree-empty" class="tree-empty">正在连接 SketchUp…</div>
      <ul id="component-tree" class="component-tree" aria-label="群组和组件层级"></ul>
      <div id="tree-progress" class="progress" hidden><span></span></div>
      <div class="tree-footer"><span id="tree-status" class="status" role="status">正在连接</span><span>父级大小包含子级</span></div>
    </section>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="running-actions" class="running-actions" hidden>
      <button id="cancel" class="text-button" hidden>停止后台任务</button>
      <button id="resume-scan" class="text-button" hidden>继续读取</button>
    </div>
  </main>
  <script src="tree.js"></script>
  <script src="panel.js"></script>
</body>
</html>
